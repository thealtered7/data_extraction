# Docker / streaming_streaming network (hostname = postgres service)
# Loaded after application.yml via SPRING_CONFIG_ADDITIONAL_LOCATION.

source_database.hostname=postgres
source_database.port=5432
source_database.user=extract_pipeline_user
source_database.password=extract_pipeline_user
source_database.dbname=geo
source_database.slot_name=extract_slot
source_database.publication_name=extract_publication
# Anchored regex of schema.table names. Unset snapshots every non-system table.
source_database.table-include-list=public\\.wide
source_database.instance_name=streaming_service_postgres
source_database.offset_storage_file_filename=/opt/data/raw/snapshot-offsets.dat

filewriter.base-path=/opt/data/
filewriter.environment=raw
filewriter.output-format=avro

dataextraction.max-buffer-size-bytes=1073741824
dataextraction.extract-namespace=geo

kafka.brokers=kafka:9092
# In-network clients resolve kafka. Clear the host rewrite from application.yml.
kafka.advertised-host-overrides.kafka=
kafka.topics=cdc-file-write
kafka.client-id=data-extraction
kafka.acks=all

# streaming/docker-compose.yml service schema-registry (SCHEMA_REGISTRY_HOST_NAME, listener 8081)
schema-registry.type=confluent
schema-registry.confluent.url=http://schema-registry:8081
schema-registry.confluent.auto-register-schemas=true
schema-registry.confluent.compatibility-level=BACKWARD

datapipelines.base-url=http://datapipelines-app:8080
datapipelines.request-timeout-seconds=10
datapipelines.jwt.enabled=false
datapipelines.jwt.ttl-seconds=300
